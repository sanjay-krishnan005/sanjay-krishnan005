<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sanjay Krishnan — AI Engineer</title>
  <desc id="desc">Dark navy banner with cyan and violet geometric accents for an AI engineer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#15102B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="45" r="140" fill="#8B5CF6" opacity=".10"/>
  <circle cx="1110" cy="235" r="170" fill="#22D3EE" opacity=".08"/>
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity=".75">
    <path d="M865 72L945 115L1020 65L1090 110L1150 70"/>
    <path d="M900 190L980 145L1050 190L1120 150L1170 180"/>
    <path d="M945 115L980 145M1020 65L1050 190M1090 110L1120 150"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="865" cy="72" r="5"/><circle cx="945" cy="115" r="5"/>
    <circle cx="1020" cy="65" r="5"/><circle cx="1090" cy="110" r="5"/>
    <circle cx="1150" cy="70" r="5"/><circle cx="900" cy="190" r="5"/>
    <circle cx="980" cy="145" r="5"/><circle cx="1050" cy="190" r="5"/>
    <circle cx="1120" cy="150" r="5"/><circle cx="1170" cy="180" r="5"/>
  </g>
  <rect x="62" y="57" width="7" height="183" rx="3.5" fill="url(#accent)"/>
  <text x="96" y="124" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="49" font-weight="750" letter-spacing="1">SANJAY KRISHNAN S.</text>
  <text x="98" y="169" fill="#67E8F9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" letter-spacing="4">AI ENGINEER</text>
  <text x="98" y="207" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">MACHINE LEARNING  ·  COMPUTER VISION  ·  GENERATIVE AI</text>
  <text x="98" y="246" fill="#A78BFA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="2">BUILDING PRACTICAL INTELLIGENCE</text>
</svg>
